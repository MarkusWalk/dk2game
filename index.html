<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09060d">
  <meta name="description" content="Dungeon Heart — a Babylon.js dungeon management game inspired by the classics.">
  <title>Dungeon Heart — Babylon Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles-babylon.css">
</head>
<body>
  <main id="babylon-app">
    <canvas id="renderCanvas" aria-label="Dungeon game world" tabindex="0"></canvas>
    <div id="ui-root"></div>
    <div id="boot-status" role="status" aria-live="polite">
      <span class="boot-sigil">♦</span>
      <strong>Awakening the Dungeon Heart</strong>
      <span>Preparing the underworld…</span>
    </div>
  </main>
  <noscript>
    <div class="no-script">Dungeon Heart requires JavaScript to run.</div>
  </noscript>

  <!-- Pinned, build-free Babylon distribution. The loader enables authored
       GLB assets while procedural fallbacks keep the game playable without
       optional model downloads. -->
  <script src="https://cdn.jsdelivr.net/npm/babylonjs@9.25.0/babylon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@9.25.0/babylonjs.loaders.min.js"></script>
  <script type="module" src="./src/babylon/main.js"></script>
</body>
</html>
