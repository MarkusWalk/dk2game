<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon creatures — model preview</title>
<style>
  * { box-sizing: border-box; } body { margin: 0; background: #161c22; color: #eedfc8; font: 15px system-ui; }
  canvas { width: 100vw; height: 100vh; display: block; touch-action: none; }
  aside { position: absolute; top: 24px; left: 24px; max-width: 380px; padding: 20px; background: #14191de8; border: 1px solid #796044; border-radius: 12px; }
  h1 { margin: 0 0 8px; font-size: 24px; } p { line-height: 1.5; color: #c1b8ab; }
  nav { display: flex; flex-wrap: wrap; gap: 7px; } button { background: #302a24; border: 1px solid #756149; border-radius: 5px; padding: 8px 12px; color: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: #80562c; } a { color: #edc68d; } a[aria-current="page"] { color: #fff2d6; font-weight: 600; text-decoration: none; }
  #creatures { margin: 0 0 12px; }
</style>
<canvas id="view" aria-label="Interactive 3D creature model"></canvas>
<aside>
  <nav id="creatures" aria-label="Creatures"></nav>
  <h1 id="title">Dungeon imp</h1><p id="edition"></p><p>Drag to orbit · scroll to zoom</p>
  <nav id="clips"></nav>
  <p><button id="playback">Pause</button> <label>Pose <input id="timeline" type="range" min="0" max="1" step="0.001" value="0" aria-label="Animation position"></label></p>
  <p id="status">Loading model…</p>
  <p id="versions"></p>
  <a href="../../index.html">Open game</a>
</aside>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.25.0/babylon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@9.25.0/babylonjs.loaders.min.js"></script>
<script type="module">
  import { AssetLibrary } from '../../src/babylon/assets.js';
  const B = window.BABYLON;
  // Every authored creature: GLB file stem, display name, and a short edition note.
  const CREATURES = {
    'imp': { title: 'Dungeon imp', edition: 'Dungeon Keeper 2 worker imp' },
    'bile-demon': { title: 'Bile Demon', edition: 'Dungeon Keeper 2 bile demon' },
    'troll': { title: 'Troll', edition: 'Dungeon Keeper 2 workshop troll' },
    'warlock': { title: 'Warlock', edition: 'Dungeon Keeper 2 warlock' },
    'fly': { title: 'Fly', edition: 'Giant dungeon fly' },
    'knight': { title: 'Knight', edition: 'Dungeon Keeper 2 knight hero' },
    'archer': { title: 'Archer', edition: 'Dungeon Keeper 2 elven archer' },
    'priest': { title: 'Priest', edition: 'Healer hero in the DK2 style' },
  };
  // Earlier imp revisions are kept for comparison; they are separate versions, not runtime LODs.
  const IMP_VERSIONS = {
    classic: { file: './imp-lowpoly-v1.glb', edition: 'Original · faceted materials', label: 'First version' },
    detailed: { file: './imp-detailed-v2.glb', edition: 'Previous · detailed orange imp', label: 'Detailed orange' },
    cute: { file: './imp-cute-v3.glb', edition: 'Previous · cute interpretation', label: 'Cute' },
  };
  const params = new URLSearchParams(location.search);
  const model = CREATURES[params.get('model')] ? params.get('model') : 'imp';
  const version = model === 'imp' && IMP_VERSIONS[params.get('version')] ? params.get('version') : null;
  const file = version ? IMP_VERSIONS[version].file : `./${model}.glb`;
  document.title = `${CREATURES[model].title} — model preview`;
  document.getElementById('title').textContent = CREATURES[model].title;
  document.getElementById('edition').textContent = version ? IMP_VERSIONS[version].edition : CREATURES[model].edition;
  for (const [key, entry] of Object.entries(CREATURES)) {
    const link = document.createElement('a'); link.href = `?model=${key}`; link.textContent = entry.title;
    if (key === model && !version) link.setAttribute('aria-current', 'page');
    document.getElementById('creatures').append(link);
  }
  if (model === 'imp') {
    const versions = document.getElementById('versions');
    versions.append('Imp revisions: ');
    const links = [['?model=imp', 'DK2 imp', !version], ...Object.entries(IMP_VERSIONS).map(([key, entry]) => [`?model=imp&version=${key}`, entry.label, version === key])];
    links.forEach(([href, label, current], index) => {
      if (index) versions.append(' · ');
      const link = document.createElement('a'); link.href = href; link.textContent = label;
      if (current) link.setAttribute('aria-current', 'page');
      versions.append(link);
    });
  }
  const engine = new B.Engine(document.getElementById('view'), true);
  const scene = new B.Scene(engine);
  scene.clearColor = new B.Color4(.055, .072, .09, 1);
  const camera = new B.ArcRotateCamera('camera', 1.15, 1.2, 2.9, new B.Vector3(-.05, .62, 0), scene);
  camera.attachControl(engine.getRenderingCanvas(), true);
  camera.lowerRadiusLimit = 1; camera.upperRadiusLimit = 9; camera.wheelPrecision = 70;
  const fill = new B.HemisphericLight('fill', new B.Vector3(0, 1, .3), scene); fill.intensity = .55;
  const key = new B.DirectionalLight('key', new B.Vector3(.5, -1, -.8), scene);
  key.position = new B.Vector3(-2, 4, 3); key.intensity = 2.2;
  key.diffuse = new B.Color3(1, .83, .65);
  const rim = new B.DirectionalLight('rim', new B.Vector3(-.5, -.5, 1), scene);
  rim.diffuse = new B.Color3(.4, .66, 1); rim.intensity = 1.5;
  const shadows = new B.ShadowGenerator(1024, key); shadows.useBlurExponentialShadowMap = true; shadows.blurKernel = 24;
  const ground = B.MeshBuilder.CreateGround('ground', { width: 200, height: 200 }, scene);
  const mat = new B.StandardMaterial('ground', scene); mat.diffuseColor = new B.Color3(.055, .067, .079); mat.specularColor.setAll(0);
  ground.material = mat; ground.receiveShadows = true; ground.position.y = -.008;
  const library = new AssetLibrary(scene, { shadowGenerator: shadows });
  try {
    await library.load(`entity:${model}`, file);
    const creature = library.instantiate(`entity:${model}`, { animation: 'Idle' });
    let active = creature.animationGroups.find(g => g.name.endsWith('Idle')) || creature.animationGroups[0];
    let playing = true;
    const playback = document.getElementById('playback');
    const timeline = document.getElementById('timeline');
    playback.onclick = () => {
      playing = !playing;
      if (playing) active.play(!/Death|Hit/.test(active.name)); else active.pause();
      playback.textContent = playing ? 'Pause' : 'Play';
    };
    timeline.oninput = () => {
      active.pause(); playing = false; playback.textContent = 'Play';
      active.goToFrame(active.from + Number(timeline.value) * (active.to - active.from));
    };
    for (const clip of creature.animationGroups) {
      const name = clip.name.split(':').pop();
      const button = document.createElement('button'); button.textContent = name;
      button.setAttribute('aria-pressed', String(clip === active));
      button.onclick = () => {
        creature.animationGroups.forEach(group => group.stop());
        clip.start(!['Death', 'Hit'].includes(name));
        active = clip; playing = true; playback.textContent = 'Pause'; timeline.value = 0;
        document.querySelectorAll('#clips button').forEach(b => b.setAttribute('aria-pressed', String(b === button)));
      };
      document.getElementById('clips').append(button);
    }
    // Frame whatever size the creature is: knights are far taller than imps.
    const bounds = creature.root.getHierarchyBoundingVectors();
    const height = bounds.max.y - bounds.min.y;
    camera.target = new B.Vector3(0, bounds.min.y + height * .5, 0);
    camera.radius = Math.max(2.4, height * 2.35);
    const triangles = creature.root.getChildMeshes().reduce((count, mesh) => count + mesh.getTotalIndices() / 3, 0);
    document.getElementById('status').textContent = `${triangles.toLocaleString()} triangles · ${creature.skeletons[0]?.bones.length ?? 0} bones · ${creature.animationGroups.length} clips · ${height.toFixed(2)} units tall`;
  } catch (error) {
    document.getElementById('status').textContent = `Could not load ${CREATURES[model].title}: ${error.message}`;
    console.error(error);
  }
  engine.runRenderLoop(() => scene.render());
  window.addEventListener('resize', () => engine.resize());
</script>
</html>
